[project]
name = "koe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.15.0",
    "pywebpush>=2.5.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
